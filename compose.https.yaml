# Optional HTTPS edge. Apply AFTER compose.yaml (and any storage override).
# Requires CLASSROOM_DOMAIN: a DNS hostname, without scheme/path/port.
services:
  classroom:
    # All public traffic must pass through Caddy; never publish this backend.
    ports: !reset []
    command: ["waitress-serve", "--listen=0.0.0.0:8080", "--threads=4", "--url-scheme=https", "--call", "service:create_app"]
    environment:
      APPWORKS_COOKIE_SECURE: "1"
      APPWORKS_RESET_ALLOW_LOCAL: "0"
      APPWORKS_RESET_BASE_URL: "https://${CLASSROOM_DOMAIN:?Set CLASSROOM_DOMAIN to the public DNS hostname}"
  https:
    image: caddy:2.10.2-alpine
    environment:
      CLASSROOM_DOMAIN: ${CLASSROOM_DOMAIN:?Set CLASSROOM_DOMAIN to the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - classroom-tls-data:/data
      - classroom-tls-config:/config
    depends_on:
      classroom:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
volumes:
  classroom-tls-data:
  classroom-tls-config:
