<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลืมรหัสผ่าน · Classroom</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:16px system-ui,sans-serif;color:#202735;background:#f7f8fa}main{max-width:460px;margin:48px auto;background:white;padding:24px;border:1px solid #e2e6ec;border-radius:18px}h1{font-size:26px}p{line-height:1.8;overflow-wrap:anywhere}label{display:block;margin-top:20px}input,button{font:inherit;width:100%;padding:14px;margin-top:8px;border:1px solid #dfe3eb;border-radius:9px}button{background:#305de8;color:white;margin-top:24px;cursor:pointer}a{display:inline-block;padding:14px 0;color:#305de8}.error{color:#a72e28}input:focus,a:focus,button:focus{outline:3px solid #a8bfff}
</style></head><body><main><h1>ลืมรหัสผ่าน</h1>
{% if message %}<p role="status">{{ message }}</p>{% endif %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% if reset %}
{% if not success %}
<p>ตั้งรหัสผ่านใหม่ 12–128 ตัวอักษร ลิงก์ใช้ได้ครั้งเดียวภายใน 30 นาที</p>
<form method="post" action="/reset-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" id="token" name="token" value="{{ token or '' }}">
<label for="password">รหัสผ่านใหม่</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<label for="confirmation">ยืนยันรหัสผ่านใหม่</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button type="submit">บันทึกรหัสผ่านใหม่</button></form>
<noscript><p>กรุณาเปิด JavaScript เพื่อรับลิงก์อย่างปลอดภัย โดยไม่ส่งโทเค็นใน URL ไปยังเซิร์ฟเวอร์</p></noscript>
<script>const capability=location.hash.slice(1);history.replaceState(null,'','/reset-password');if(/^[A-Za-z0-9_-]{43}$/.test(capability))document.getElementById('token').value=capability;</script>
<a href="/forgot-password">ขอลิงก์ใหม่</a>
{% endif %}
{% else %}
<form method="post" action="/forgot-password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="email">อีเมลที่ใช้สมัคร</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><button type="submit">ขอลิงก์ตั้งรหัสผ่านใหม่</button></form>
{% endif %}
<a href="/login">กลับไปเข้าสู่ระบบ</a></main></body></html>
