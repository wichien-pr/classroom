{% from 'avatar.html' import avatar %}<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Leaderboards{% endblock %} · Classroom</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#202735;font:16px system-ui,sans-serif;line-height:1.65}header{background:white;border-bottom:1px solid #e4e7eb}.top,nav,main{max-width:1160px;margin:auto}.top{display:flex;align-items:center;gap:16px;padding:20px 24px;flex-wrap:wrap}.logo{background:#305de8;color:white;border-radius:12px;padding:10px;font-weight:800}.brand{font-weight:750;font-size:20px}.sub,small{color:#687387;font-size:12px}.user{margin-left:auto;overflow-wrap:anywhere}nav{display:flex;flex-wrap:wrap;gap:28px;padding:0 24px}nav a{padding:16px 0;text-decoration:none;color:#586579}nav a.active{color:#305de8;border-bottom:3px solid #305de8}main{padding:32px 24px}h1{font-size:30px;margin:0}h2{font-size:21px;margin:0 0 14px}h3{font-size:17px;margin:0}p{color:#627086}a{color:#305de8}button,.button{display:inline-block;font:inherit;background:#305de8;color:white;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;text-decoration:none;min-height:44px}button:disabled{opacity:.5;cursor:wait}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #e7a627;outline-offset:3px}.panel{background:white;border:1px solid #e1e5ec;border-radius:12px;padding:24px;margin-bottom:24px}.overview{display:grid;grid-template-columns:250px 1fr;gap:30px}.profile{text-align:center;border-right:1px solid #e7eaf0;padding-right:24px}.badge{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#e9efff;color:#305de8;font-size:28px;font-weight:750;margin:8px auto}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.level{display:flex;gap:12px}.number{flex-shrink:0;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#edf0f5;color:#748198}.reached .number{background:#305de8;color:white}.level p{font-size:13px;margin:3px 0}.ranking{width:100%;border-collapse:collapse}th,td{text-align:left;padding:16px 12px;border-bottom:1px solid #edf0f5;overflow-wrap:anywhere}th{font-size:13px;color:#687387}.self{background:#f0f4ff}.rank{font-weight:750;color:#305de8}fieldset{border:1px solid #dfe4ed;border-radius:10px;padding:22px;margin:20px 0;min-width:0}legend{font-weight:650;max-width:100%;overflow-wrap:anywhere}label{display:flex;gap:12px;padding:12px;margin:6px 0;background:#f6f8fb;border-radius:7px;cursor:pointer}input[type=radio]{flex-shrink:0;accent-color:#305de8;width:18px}#status{white-space:pre-wrap;overflow-wrap:anywhere}.result{padding:20px;background:#eef5ef;border-radius:10px}.muted{font-size:13px;color:#687387}@media(max-width:760px){.overview{grid-template-columns:1fr}.profile{border-right:0;border-bottom:1px solid #e7eaf0;padding:0 0 24px}.levels{grid-template-columns:repeat(2,1fr)}main{padding:24px 16px}.panel{padding:18px}.top{padding:16px}.brand{font-size:17px}th,td{padding:12px 6px;font-size:14px}}@media(max-width:380px){.levels{grid-template-columns:1fr}}
{% include 'profile-style.html' %}</style></head><body><header><div class="top"><span class="logo">aw.</span><div><div class="brand">Appworks Community</div><div class="sub">LEARN. BUILD. GROW TOGETHER.</div></div><a class="account-link" href="/account/profile" aria-label="โปรไฟล์บัญชี">{{ avatar(user) }}<span>{{ user.name }}</span></a><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>ออกจากระบบ</button></form></div><nav><a href="/">Classroom</a><a {% if request.endpoint == 'leaderboards' %}class="active" aria-current="page" {% endif %}href="/leaderboards">Leaderboards</a><a {% if request.endpoint == 'account_profile' %}class="active" aria-current="page" {% endif %}href="/account/profile">Profile</a></nav></header><main>{% block content %}{% endblock %}</main></body></html>
