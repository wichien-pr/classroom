<style>
.brand-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.presence{position:relative;font-size:13px;font-weight:400;line-height:1.5}.presence [hidden]{display:none!important}.presence button{font:inherit;min-height:44px;border-radius:22px;border:1px solid #dce7e1;padding:7px 12px;background:#f4faf6;color:#28563c;cursor:pointer}.presence button:focus-visible,.presence a:focus-visible{outline:3px solid #e7a627;outline-offset:2px}.presence #presence-toggle{display:flex;align-items:center;gap:7px;white-space:nowrap}.presence-dot{width:7px;height:7px;border-radius:50%;background:#87918b}.presence[data-state=ready] .presence-dot{background:#20864b}.presence-stack{display:flex;padding-left:5px}.presence-face{position:relative;display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;border:2px solid white;background:#e9efff;color:#3051a8;font-size:10px;font-weight:700;overflow:hidden;flex-shrink:0}.presence-face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.presence-stack .presence-face{margin-left:-5px}.presence-panel{position:absolute;top:calc(100% + 8px);left:0;z-index:50;width:300px;max-width:calc(100vw - 32px);padding:16px;background:white;border:1px solid #dfe5e2;border-radius:14px;box-shadow:0 12px 35px #18352426;color:#263b30}.presence-panel h2{font-size:16px;margin:0}.presence-panel p{font-size:12px;color:#66736b;margin:8px 0}.presence-panel ul{padding:0;margin:8px 0;list-style:none;max-height:260px;overflow-y:auto}.presence-panel li a{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 2px;color:#284b36;text-decoration:none;overflow-wrap:anywhere}.presence-panel li a>span:last-child{min-width:0}.presence-panel li a small{display:block;color:#69766f}.presence-paging{display:flex;align-items:center;justify-content:space-between;gap:6px}.presence-paging button{padding:5px 10px}.presence button:disabled{opacity:.5;cursor:default}.presence-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.presence-title button{border:0;background:#f1f4f2;color:#334c3d;border-radius:8px}.presence-status{min-height:18px}.presence-panel a:hover{text-decoration:underline}
@media(max-width:600px){.brand-line{gap:2px}.presence-panel{position:fixed;top:150px;left:16px;right:16px;width:auto;max-height:calc(100dvh - 170px);overflow-y:auto}.presence #presence-toggle{padding:4px 8px}.top{gap:12px}.brand{font-size:18px}}
</style>
<div class="presence" data-state="loading">
<button id="presence-toggle" type="button" aria-expanded="false" aria-controls="presence-panel"><span class="presence-dot" aria-hidden="true"></span><span id="presence-label">กำลังตรวจสอบออนไลน์…</span><span id="presence-stack" class="presence-stack" aria-hidden="true"></span></button>
<section id="presence-panel" class="presence-panel" aria-labelledby="presence-title" hidden>
<div class="presence-title"><h2 id="presence-title">สมาชิกออนไลน์</h2><button id="presence-close" type="button" aria-label="ปิดรายชื่อออนไลน์">✕</button></div>
<p>เปิดหน้าเว็บที่มองเห็นในช่วง 2 นาทีล่าสุด · รวมคุณด้วย<br>เมื่อซ่อนหรือปิดแท็บ อาจยังแสดงได้ไม่เกิน 2 นาที</p>
<p id="presence-status" class="presence-status" role="status" aria-live="polite">กำลังตรวจสอบ…</p>
<ul id="presence-members" aria-label="รายชื่อสมาชิกออนไลน์"></ul>
<div class="presence-paging"><button id="presence-prev" type="button" disabled>ก่อนหน้า</button><span id="presence-page"></span><button id="presence-next" type="button" disabled>ถัดไป</button></div>
<button id="presence-retry" type="button" hidden>ลองใหม่</button>
</section>
</div>
