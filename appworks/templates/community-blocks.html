<div class="ordered-content">{% for block in post.ordered_blocks %}{% if block.type == 'text' %}{% if block.text %}<div class="post-text">{{ block.text }}</div>{% endif %}{% else %}{% set file=block.file %}<figure>{% if file.mime == 'image/gif' %}<details class="gif-player"><summary>▶ เล่น GIF · {{ file.name }}</summary><img loading="lazy" src="/community/media/{{ file.id }}" alt="{{ file.name }}"></details>{% elif file.mime.startswith('image/') %}<img loading="lazy" src="/community/media/{{ file.id }}" alt="{{ file.name }}">{% else %}<a href="/community/media/{{ file.id }}">{{ file.name }}</a>{% endif %}</figure>{% endif %}{% endfor %}</div>
