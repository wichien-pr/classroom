<script>
(() => {
const form=document.querySelector('#composer'), dialog=document.querySelector('#composer-dialog');
if(!form || !dialog.showModal) return;
const prompt=document.querySelector('#write-prompt'), parent=form.parentElement;
dialog.append(form); form.classList.add('enhanced');
const body=form.elements.body, submit=document.querySelector('#composer-submit'), status=document.querySelector('#composer-status'), input=form.elements.attachments;
const editor=document.createElement('div');editor.id='block-editor';editor.setAttribute('role','group');editor.setAttribute('aria-label','Write something… · เนื้อหาและภาพ');body.after(editor);body.hidden=true;body.required=false;
const payload=document.createElement('input');payload.type='hidden';payload.name='content_blocks';form.append(payload);
const retained=[...form.querySelectorAll('[data-existing]')].map(e=>({id:Number(e.dataset.existing),name:e.querySelector('figcaption a').textContent,src:e.querySelector('img')?.getAttribute('src')}));
document.querySelector('#file-preview').hidden=true;
const originalRemoved=form.elements.remove_attachments.value.split(',');
let initial;try{initial=JSON.parse(form.dataset.blocks||'null')}catch{initial=null}
if(!initial)initial=[{type:'text',text:body.value},...retained.filter(f=>!originalRemoved.includes(String(f.id))).map(f=>({type:'attachment',id:f.id}))];
let blocks=[],selected=[],urls=[],dirty=false,sending=false,active=null,offset=0;
const gif=document.createElement('input');gif.type='file';gif.accept='.gif';gif.multiple=true;gif.hidden=true;form.append(gif);
function textNode(text=''){const el=document.createElement('div');el.contentEditable='plaintext-only';el.className='editor-text';el.setAttribute('role','textbox');el.setAttribute('aria-label','Write something…');el.setAttribute('aria-multiline','true');el.dataset.placeholder='Write something… · พิมพ์ก่อนหรือหลังภาพ';el.textContent=text;return el;}
function read(){blocks=[...editor.children].map(el=>el._media||{type:'text',text:el.innerText.replace(/\r\n/g,'\n')});return blocks;}
function remember(){const sel=getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);const el=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;const t=el.closest('.editor-text');if(!t||t.parentElement!==editor)return;active=t;const before=r.cloneRange();before.selectNodeContents(t);before.setEnd(r.startContainer,r.startOffset);offset=before.toString().length;}
document.addEventListener('selectionchange',remember);
function focusAt(el,pos){el.focus();const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;let remaining=pos;while(n=walker.nextNode()){if(remaining<=n.length){const r=document.createRange();r.setStart(n,remaining);r.collapse(true);getSelection().removeAllRanges();getSelection().addRange(r);remember();return;}remaining-=n.length;}const r=document.createRange();r.selectNodeContents(el);r.collapse(false);getSelection().removeAllRanges();getSelection().addRange(r);remember();}
function sync(){read();const transfer=new DataTransfer();selected.forEach(f=>transfer.items.add(f));input.files=transfer.files;const refs=new Set(blocks.filter(b=>'id'in b).map(b=>b.id));form.elements.remove_attachments.value=retained.filter(f=>!refs.has(f.id)).map(f=>f.id).join(',');body.value=blocks.filter(b=>b.type==='text').map(b=>b.text).join('');payload.value=JSON.stringify(blocks.map(b=>b.file?{type:'attachment',upload:selected.indexOf(b.file)}:b));const hasImage=blocks.some(b=>b.type==='attachment'&&(b.file?/\.(png|jpe?g|webp|gif)$/i.test(b.file.name):retained.find(f=>f.id===b.id)?.src));submit.disabled=!form.elements.title.value.trim()||!form.elements.category.value||(!body.value.trim()&&!hasImage)||[...body.value].length>2000||blocks.length>64||[...form.elements].some(e=>e.willValidate&&!e.validity.valid);}
function draw(data){urls.forEach(URL.revokeObjectURL);urls=[];editor.replaceChildren();active=null;
for(const b of data){if(b.type==='text'){editor.append(textNode(b.text));continue;}if(!editor.lastElementChild||!editor.lastElementChild.classList.contains('editor-text'))editor.append(textNode());const f=b.file||retained.find(f=>f.id===b.id);if(!f)continue;const card=document.createElement('figure');card.contentEditable='false';card._media=b;card.className='editor-media';if(b.id)card.dataset.existing=b.id;
let src=b.file&&/\.(png|jpe?g|webp|gif)$/i.test(f.name)?URL.createObjectURL(f):f.src;if(b.file&&src)urls.push(src);if(src){const im=document.createElement('img');im.src=src;im.alt=f.name;card.append(im);}const caption=document.createElement('figcaption');caption.textContent=f.name;card.append(caption);
for(const [label,action] of [['↑',-1],['↓',1],['นำออก',0]]){const btn=document.createElement('button');btn.type='button';btn.textContent=label;btn.setAttribute('aria-label',label+' '+f.name);btn.addEventListener('click',()=>{read();const i=blocks.indexOf(b);if(action===0){blocks.splice(i,1);if(b.file)selected=selected.filter(x=>x!==b.file);}else{const j=i+action;if(j>=0&&j<blocks.length)[blocks[i],blocks[j]]=[blocks[j],blocks[i]];}dirty=true;draw(blocks);sync();});card.append(btn);}editor.append(card);}
if(!editor.lastElementChild||!editor.lastElementChild.classList.contains('editor-text'))editor.append(textNode());sync();}
function insertMedia(files){read();const additions=files.filter((f,i)=>!selected.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified)&&files.findIndex(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified)===i);const count=blocks.filter(b=>b.type==='attachment').length;if(additions.length+count>4||additions.some(f=>f.size>5*1024*1024||! /\.(png|jpe?g|webp|gif|pdf|txt)$/i.test(f.name))){status.textContent='เลือกได้สูงสุด 4 ไฟล์ ไฟล์ละ 5 MiB';sync();return;}if(!additions.length){sync();return;}
let index=active&&active.isConnected?[...editor.children].indexOf(active):blocks.length-1;let b=blocks[index];if(b?.type!=='text'){blocks.push({type:'text',text:''});index=blocks.length-1;b=blocks[index];offset=0;}const pos=active&&active.isConnected?Math.min(offset,b.text.length):b.text.length;selected.push(...additions);blocks.splice(index,1,{type:'text',text:b.text.slice(0,pos)},...additions.map(file=>({type:'attachment',file})),{type:'text',text:b.text.slice(pos)});dirty=true;draw(blocks);status.textContent='ไฟล์พร้อมแนบ · เซิร์ฟเวอร์จะตรวจสอบเนื้อหาอีกครั้ง';const texts=[...editor.querySelectorAll('.editor-text')];focusAt(texts.find((t)=>[...editor.children].indexOf(t)>index+additions.length)||texts.at(-1),0);}
function reset(){selected=[];gif.value='';draw(structuredClone(initial));dirty=false;}
function show(){dialog.showModal();form.elements.title.focus();sync();}
function close(){if(dirty&&!confirm('ยกเลิกร่างโพสต์ที่ยังไม่บันทึก?'))return;form.reset();reset();status.textContent='';dialog.close();parent.open=false;prompt.focus();}
prompt.addEventListener('click',e=>{e.preventDefault();show();});document.querySelector('#composer-cancel').addEventListener('click',e=>{e.preventDefault();close();});dialog.addEventListener('cancel',e=>{e.preventDefault();close();});
form.addEventListener('input',e=>{if(e.target===input||e.target===gif)return;dirty=true;sync();});form.addEventListener('change',()=>{dirty=true;sync();});form.addEventListener('submit',()=>{sync();sending=true;submit.disabled=true;});
// Plain-text editing surfaces cannot delete neighboring noneditable media. Never import pasted HTML or remote images.
editor.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text);sync();});editor.addEventListener('drop',e=>e.preventDefault());
input.addEventListener('change',()=>insertMedia([...input.files]));gif.addEventListener('change',()=>{insertMedia([...gif.files]);gif.value='';});
form.querySelectorAll('[data-tool]').forEach(button=>button.addEventListener('click',()=>{const tool=button.dataset.tool;if(tool==='files'){input.click();return;}if(tool==='gif'){gif.click();return;}if(tool==='emoji'){const picker=document.querySelector('#emoji-picker');picker.hidden=!picker.hidden;if(!picker.hidden)picker.querySelector('button').focus();return;}const panel=form.querySelector(`[data-panel="${tool}"]`);panel.open=!panel.open;if(panel.open)panel.querySelector('input,textarea').focus();}));
form.querySelectorAll('[data-emoji]').forEach(button=>button.addEventListener('click',()=>{const t=active?.isConnected?active:editor.querySelector('.editor-text');focusAt(t,offset);document.execCommand('insertText',false,button.dataset.emoji);dirty=true;sync();}));
form.querySelector('[data-clear-poll]').addEventListener('click',()=>{form.elements.poll_question.value='';form.elements.poll_options.value='';dirty=true;form.querySelector('[data-panel=poll]').open=false;sync();});
window.addEventListener('beforeunload',e=>{if(dirty&&!sending){e.preventDefault();e.returnValue='';}});window.addEventListener('pagehide',()=>urls.forEach(URL.revokeObjectURL));reset();if(form.dataset.open==='yes')show();
})();
</script>
